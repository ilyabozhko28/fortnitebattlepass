services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harmony-backend
    ports:
      - "8000:8000"
    environment:
      - HARMONY_CORS_ORIGINS=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: harmony-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
