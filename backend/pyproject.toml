[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-backend"
version = "0.1.0"
description = "Frontal Harmony — CV + AI scripts and thin FastAPI transport shim."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.14",
  "Pillow>=10.3",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harmony*", "shim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
